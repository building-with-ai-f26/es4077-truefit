[project]
name = "truefit"
version = "0.1.0"
description = "Start-date check and truthful, ATS-ready tailored resumes for MBA job postings"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "posthog>=7.69.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pypdf>=7.1.0",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/api"]
